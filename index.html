<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>LED HUD v3</title>
  <style>
    body {
      margin: 0;
      padding: 16px;
      background: #0e1117;
      color: #fff;
      font-family: -apple-system, system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    h2 {
      margin: 4px 0 12px;
      font-size: 1.1rem;
      color: #00ff66;
    }
    #matrix {
      width: 192px;
      height: 192px;
      background: #000;
      border: 2px solid #30363d;
      border-radius: 6px;
      image-rendering: pixelated;
    }
    .btn {
      width: 100%;
      max-width: 320px;
      padding: 14px;
      margin: 8px 0;
      font-size: 1rem;
      font-weight: bold;
      border: none;
      border-radius: 6px;
      background: #00ff66;
      color: #000;
      cursor: pointer;
    }
    .btn:disabled {
      background: #2b313a;
      color: #6e7681;
    }
    .btn-red {
      background: #ff4d4f;
      color: #fff;
    }
    input {
      width: 100%;
      max-width: 300px;
      padding: 10px;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 4px;
      color: #fff;
      font-size: 0.95rem;
      box-sizing: border-box;
    }
    #log {
      width: 100%;
      max-width: 320px;
      height: 120px;
      background: #000;
      border: 1px solid #30363d;
      border-radius: 4px;
      padding: 8px;
      margin-top: 10px;
      font-family: monospace;
      font-size: 0.75rem;
      color: #58a6ff;
      overflow-y: scroll;
      white-space: pre-wrap;
      box-sizing: border-box;
    }
  </style>
</head>
<body>

  <h2>Backpack HUD Controller</h2>

  <canvas id="matrix" width="64" height="64"></canvas>

  <button id="connectBtn" class="btn">Connect Backpack (BLE)</button>
  <button id="gpsBtn" class="btn" disabled>Start GPS Speedometer</button>
  <button id="testColorBtn" class="btn" style="background: #38bdf8;" disabled>Send Test Pattern</button>

  <input type="text" id="trackInput" value="Daft Punk - Technologic" placeholder="Track Name">

  <div id="log">System initialized. Ready.</div>

  <script>
    const SERVICE_UUID = '0000e031-0000-1000-8000-00805f9b34fb';
    const WRITE_CHAR_UUID = '0000a031-0000-1000-8000-00805f9b34fb';

    const canvas = document.getElementById('matrix');
    const ctx = canvas.getContext('2d');
    const logEl = document.getElementById('log');
    const connectBtn = document.getElementById('connectBtn');
    const gpsBtn = document.getElementById('gpsBtn');
    const testColorBtn = document.getElementById('testColorBtn');
    const trackInput = document.getElementById('trackInput');

    let bleDevice = null;
    let writeChar = null;
    let gpsWatchId = null;
    let currentSpeed = 0;
    let scrollPos = 0;
    let isTransmitting = false;

    function print(msg) {
      logEl.textContent += '\n' + msg;
      logEl.scrollTop = logEl.scrollHeight;
    }

    // Always draw frame locally on phone canvas
    function drawHUD() {
      ctx.fillStyle = '#000000';
      ctx.fillRect(0, 0, 64, 64);

      // Speed Digits
      ctx.fillStyle = '#00FF66';
      ctx.font = 'bold 24px monospace';
      ctx.textAlign = 'center';
      ctx.fillText(Math.round(currentSpeed).toString(), 32, 24);

      // Units
      ctx.fillStyle = '#888888';
      ctx.font = '8px monospace';
      ctx.fillText('MPH', 32, 34);

      // Divider
      ctx.strokeStyle = '#222222';
      ctx.beginPath();
      ctx.moveTo(4, 40);
      ctx.lineTo(60, 40);
      ctx.stroke();

      // Music Text
      ctx.save();
      ctx.beginPath();
      ctx.rect(0, 42, 64, 22);
      ctx.clip();
      ctx.fillStyle = '#38bdf8';
      ctx.font = '9px monospace';
      ctx.textAlign = 'left';

      const title = (trackInput.value || 'Idle').trim();
      const txtWidth = ctx.measureText(title).width;
      ctx.fillText(title, 64 - scrollPos, 54);
      ctx.restore();

      scrollPos += 2;
      if (scrollPos > txtWidth + 64) scrollPos = 0;
    }

    // Continuously render local phone preview
    setInterval(drawHUD, 100);

    // Convert 64x64 canvas to RGB565 packets and send via BLE
    async function sendFrame() {
      if (!writeChar || isTransmitting) return;
      isTransmitting = true;

      try {
        const img = ctx.getImageData(0, 0, 64, 64).data;
        // 64x64 at 2 bytes per pixel = 8192 bytes
        const rgb565 = new Uint8Array(64 * 64 * 2);

        for (let i = 0; i < 4096; i++) {
          const r = img[i * 4] >> 3;
          const g = img[i * 4 + 1] >> 2;
          const b = img[i * 4 + 2] >> 3;
          const val = (r << 11) | (g << 5) | b;
          rgb565[i * 2] = (val >> 8) & 0xFF;
          rgb565[i * 2 + 1] = val & 0xFF;
        }

        // Send in safe standard 20-byte chunks
        const CHUNK = 20;
        for (let i = 0; i < rgb565.length; i += CHUNK) {
          const slice = rgb565.slice(i, i + CHUNK);
          if (writeChar.properties.writeWithoutResponse) {
            await writeChar.writeValueWithoutResponse(slice);
          } else {
            await writeChar.writeValue(slice);
          }
          await new Promise(res => setTimeout(res, 8));
        }
      } catch (err) {
        print('Send err: ' + err.message);
      } finally {
        isTransmitting = false;
      }
    }

    // Send a solid color quick test to verify connection
    testColorBtn.addEventListener('click', async () => {
      if (!writeChar) return;
      print('Sending test solid frame...');
      ctx.fillStyle = '#00FF66';
      ctx.fillRect(0, 0, 64, 64);
      await sendFrame();
      print('Test frame sent.');
    });

    // BLE Connect
    connectBtn.addEventListener('click', async () => {
      print('Scanning for BLE devices...');
      if (!navigator.bluetooth) {
        print('ERR: Web Bluetooth unavailable in this browser.');
        return;
      }

      try {
        bleDevice = await navigator.bluetooth.requestDevice({
          filters: [{ namePrefix: 'P031' }],
          optionalServices: [SERVICE_UUID]
        });

        print('Device selected: ' + bleDevice.name);
        print('Connecting to GATT server...');

        const server = await bleDevice.gatt.connect();
        const service = await server.getPrimaryService(SERVICE_UUID);
        writeChar = await service.getCharacteristic(WRITE_CHAR_UUID);

        print('Connected to A031! Ready to transmit.');
        connectBtn.textContent = 'Disconnect';
        connectBtn.classList.add('btn-red');
        gpsBtn.disabled = false;
        testColorBtn.disabled = false;

        bleDevice.addEventListener('gattserverdisconnected', () => {
          print('Backpack disconnected.');
          connectBtn.textContent = 'Connect Backpack (BLE)';
          connectBtn.classList.remove('btn-red');
          gpsBtn.disabled = true;
          testColorBtn.disabled = true;
          writeChar = null;
        });

        // Push frame update once per second
        setInterval(() => {
          if (writeChar) sendFrame();
        }, 1200);

      } catch (e) {
        print('Failed: ' + e.message);
      }
    });

    // GPS Handling
    gpsBtn.addEventListener('click', () => {
      if (gpsWatchId) {
        navigator.geolocation.clearWatch(gpsWatchId);
        gpsWatchId = null;
        gpsBtn.textContent = 'Start GPS Speedometer';
        currentSpeed = 0;
        print('GPS stopped.');
      } else {
        print('Requesting GPS...');
        gpsWatchId = navigator.geolocation.watchPosition(
          (pos) => {
            const mps = pos.coords.speed;
            currentSpeed = (mps !== null && mps >= 0) ? mps * 2.23694 : 0;
          },
          (e) => print('GPS Err: ' + e.message),
          { enableHighAccuracy: true, maximumAge: 500, timeout: 5000 }
        );
        gpsBtn.textContent = 'Stop GPS Speedometer';
        print('GPS tracking active.');
      }
    });
  </script>
</body>
</html>
