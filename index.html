<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>YSKJ Backpack HUD</title>
  <style>
    body {
      margin: 0;
      padding: 16px;
      background: #0e1117;
      color: #fff;
      font-family: -apple-system, system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    h2 {
      margin: 4px 0 12px;
      font-size: 1.15rem;
      color: #00ff66;
    }
    #matrix {
      width: 192px;
      height: 192px;
      background: #000;
      border: 2px solid #30363d;
      border-radius: 6px;
      image-rendering: pixelated;
    }
    .btn {
      width: 100%;
      max-width: 320px;
      padding: 14px;
      margin: 8px 0;
      font-size: 1rem;
      font-weight: bold;
      border: none;
      border-radius: 6px;
      background: #00ff66;
      color: #000;
      cursor: pointer;
    }
    .btn:disabled {
      background: #2b313a;
      color: #6e7681;
    }
    .btn-red {
      background: #ff4d4f;
      color: #fff;
    }
    input {
      width: 100%;
      max-width: 320px;
      padding: 12px;
      margin-top: 6px;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 4px;
      color: #fff;
      font-size: 0.95rem;
      box-sizing: border-box;
    }
    #log {
      width: 100%;
      max-width: 320px;
      height: 100px;
      background: #000;
      border: 1px solid #30363d;
      border-radius: 4px;
      padding: 8px;
      margin-top: 10px;
      font-family: monospace;
      font-size: 0.75rem;
      color: #58a6ff;
      overflow-y: scroll;
      white-space: pre-wrap;
      box-sizing: border-box;
    }
  </style>
</head>
<body>

  <h2>YSKJ Backpack HUD</h2>

  <canvas id="matrix" width="64" height="64"></canvas>

  <button id="connectBtn" class="btn">Connect Backpack (BLE)</button>
  <button id="gpsBtn" class="btn" disabled>Start GPS Speedometer</button>

  <input type="text" id="trackInput" value="Daft Punk - Technologic" placeholder="Track Name">

  <div id="log">Ready to connect to YS device.</div>

  <script>
    // Exact YSKJ Service and Characteristic UUIDs from nRF Connect
    const SERVICE_UUID = '0000fff0-0000-1000-8000-00805f9b34fb';
    const WRITE_CHAR_UUID = '0000fff2-0000-1000-8000-00805f9b34fb';

    const canvas = document.getElementById('matrix');
    const ctx = canvas.getContext('2d');
    const logEl = document.getElementById('log');
    const connectBtn = document.getElementById('connectBtn');
    const gpsBtn = document.getElementById('gpsBtn');
    const trackInput = document.getElementById('trackInput');

    let bleDevice = null;
    let writeChar = null;
    let gpsWatchId = null;
    let currentSpeed = 0;
    let scrollPos = 0;
    let isTransmitting = false;

    function print(msg) {
      logEl.textContent += '\n> ' + msg;
      logEl.scrollTop = logEl.scrollHeight;
    }

    // Canvas Preview Loop
    function drawHUD() {
      ctx.fillStyle = '#000000';
      ctx.fillRect(0, 0, 64, 64);

      // Speed Digits
      ctx.fillStyle = '#00FF66';
      ctx.font = 'bold 24px monospace';
      ctx.textAlign = 'center';
      ctx.fillText(Math.round(currentSpeed).toString(), 32, 22);

      // Units
      ctx.fillStyle = '#888888';
      ctx.font = '8px monospace';
      ctx.fillText('MPH', 32, 33);

      // Divider Line
      ctx.strokeStyle = '#222222';
      ctx.beginPath();
      ctx.moveTo(4, 40);
      ctx.lineTo(60, 40);
      ctx.stroke();

      // Music Text Scroll
      ctx.save();
      ctx.beginPath();
      ctx.rect(0, 42, 64, 22);
      ctx.clip();
      ctx.fillStyle = '#38bdf8';
      ctx.font = '9px monospace';
      ctx.textAlign = 'left';

      const title = (trackInput.value || 'Ready').trim();
      const txtWidth = ctx.measureText(title).width;
      ctx.fillText(title, 64 - scrollPos, 54);
      ctx.restore();

      scrollPos += 2;
      if (scrollPos > txtWidth + 64) scrollPos = 0;
    }

    setInterval(drawHUD, 100);

    // Build standard YSKJ AA 55 framed packet
    async function sendYSKJImage() {
      if (!writeChar || isTransmitting) return;
      isTransmitting = true;

      try {
        const img = ctx.getImageData(0, 0, 64, 64).data;
        const totalPixels = 64 * 64;
        
        // Convert to RGB565 format expected by LOY panels
        const rgb565 = new Uint8Array(totalPixels * 2);
        for (let i = 0; i < totalPixels; i++) {
          const r = img[i * 4] >> 3;
          const g = img[i * 4 + 1] >> 2;
          const b = img[i * 4 + 2] >> 3;
          const val = (r << 11) | (g << 5) | b;
          rgb565[i * 2] = (val >> 8) & 0xFF;
          rgb565[i * 2 + 1] = val & 0xFF;
        }

        // Full packet structure: AA 55 [Length High, Low] [Cmd 0x03] [RGB Data] [CRC]
        const totalLen = rgb565.length + 6;
        const packet = new Uint8Array(totalLen);
        packet[0] = 0xAA;
        packet[1] = 0x55;
        packet[2] = (rgb565.length >> 8) & 0xFF;
        packet[3] = rgb565.length & 0xFF;
        packet[4] = 0x03; // Realtime Canvas Frame Command
        packet.set(rgb565, 5);

        let crc = 0;
        for (let i = 0; i < packet.length - 1; i++) crc += packet[i];
        packet[packet.length - 1] = crc & 0xFF;

        // Stream across BLE in safe 20-byte chunks to characteristic FFF2
        const CHUNK = 20;
        for (let i = 0; i < packet.length; i += CHUNK) {
          const slice = packet.slice(i, i + CHUNK);
          await writeChar.writeValueWithoutResponse(slice);
          await new Promise(r => setTimeout(r, 6));
        }
      } catch (err) {
        print('Tx err: ' + err.message);
      } finally {
        isTransmitting = false;
      }
    }

    // Connect to YS device
    connectBtn.addEventListener('click', async () => {
      print('Scanning for YS backpack...');
      if (!navigator.bluetooth) {
        print('ERR: Web Bluetooth unavailable.');
        return;
      }

      try {
        bleDevice = await navigator.bluetooth.requestDevice({
          filters: [{ namePrefix: 'YS' }],
          optionalServices: [SERVICE_UUID]
        });

        print('Found: ' + bleDevice.name);
        print('Connecting...');

        const server = await bleDevice.gatt.connect();
        const service = await server.getPrimaryService(SERVICE_UUID);
        writeChar = await service.getCharacteristic(WRITE_CHAR_UUID);

        print('Connected to FFF2! Sync active.');
        connectBtn.textContent = 'Disconnect';
        connectBtn.classList.add('btn-red');
        gpsBtn.disabled = false;

        bleDevice.addEventListener('gattserverdisconnected', () => {
          print('Disconnected.');
          connectBtn.textContent = 'Connect Backpack (BLE)';
          connectBtn.classList.remove('btn-red');
          gpsBtn.disabled = true;
          writeChar = null;
        });

        // Frame stream loop (1 update every second)
        setInterval(() => {
          if (writeChar) sendYSKJImage();
        }, 1000);

      } catch (e) {
        print('Error: ' + e.message);
      }
    });

    // Speedometer Tracking
    gpsBtn.addEventListener('click', () => {
      if (gpsWatchId) {
        navigator.geolocation.clearWatch(gpsWatchId);
        gpsWatchId = null;
        gpsBtn.textContent = 'Start GPS Speedometer';
        currentSpeed = 0;
        print('GPS stopped.');
      } else {
        print('Starting GPS...');
        gpsWatchId = navigator.geolocation.watchPosition(
          (pos) => {
            const mps = pos.coords.speed;
            currentSpeed = (mps !== null && mps >= 0) ? mps * 2.23694 : 0;
          },
          (e) => print('GPS Error: ' + e.message),
          { enableHighAccuracy: true, maximumAge: 500, timeout: 5000 }
        );
        gpsBtn.textContent = 'Stop GPS Speedometer';
        print('GPS active.');
      }
    });
  </script>
</body>
</html>
