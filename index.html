<script>
  const SERVICE_UUID = '0000e031-0000-1000-8000-00805f9b34fb';
  const WRITE_CHAR_UUID = '0000a031-0000-1000-8000-00805f9b34fb';

  let bleDevice = null;
  let writeChar = null;
  let gpsWatchId = null;
  let currentSpeedMph = 0;
  let textScrollOffset = 0;
  let isSending = false;

  const canvas = document.getElementById('matrix');
  const ctx = canvas.getContext('2d');
  const statusEl = document.getElementById('status');
  const connectBtn = document.getElementById('connectBtn');
  const toggleGpsBtn = document.getElementById('toggleGpsBtn');
  const trackInput = document.getElementById('trackInput');

  function renderFrame() {
    ctx.fillStyle = '#000000';
    ctx.fillRect(0, 0, 64, 64);

    // Speedometer
    ctx.fillStyle = '#00FF66';
    ctx.font = 'bold 24px monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(Math.round(currentSpeedMph).toString(), 32, 20);

    // Units
    ctx.fillStyle = '#888888';
    ctx.font = '8px monospace';
    ctx.fillText('MPH', 32, 34);

    // Divider Line
    ctx.strokeStyle = '#222222';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(4, 40);
    ctx.lineTo(60, 40);
    ctx.stroke();

    // Marquee Track Text
    ctx.save();
    ctx.beginPath();
    ctx.rect(0, 42, 64, 22);
    ctx.clip();

    ctx.fillStyle = '#38bdf8';
    ctx.font = '9px monospace';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';

    const trackText = trackInput.value || 'Idle';
    const textWidth = ctx.measureText(trackText).width;

    ctx.fillText(trackText, 64 - textScrollOffset, 48);

    textScrollOffset += 3;
    if (textScrollOffset > textWidth + 64) {
      textScrollOffset = 0;
    }
    ctx.restore();
  }

  // Encapsulate raw RGB data into YSKJ framed packet protocol
  function buildPacket(commandId, payload) {
    const header = [0x02, 0x01, commandId];
    const len = payload.length;
    const lenBytes = [(len >> 8) & 0xFF, len & 0xFF];
    const packetData = [...header, ...lenBytes, ...payload];

    // Compute byte addition checksum
    let sum = 0;
    for (let b of packetData) sum += b;
    packetData.push(sum & 0xFF);
    packetData.push(0x03); // End byte delimiter

    return new Uint8Array(packetData);
  }

  async function transmitCanvas() {
    if (!writeChar || isSending) return;
    isSending = true;

    try {
      const imgData = ctx.getImageData(0, 0, 64, 64).data;
      const rgbPayload = new Uint8Array(64 * 64 * 3);
      
      let ptr = 0;
      for (let i = 0; i < imgData.length; i += 4) {
        rgbPayload[ptr++] = imgData[i];     // Red
        rgbPayload[ptr++] = imgData[i + 1]; // Green
        rgbPayload[ptr++] = imgData[i + 2]; // Blue
      }

      // Build framed image package (Command 0x49: direct static frame update)
      const framePacket = buildPacket(0x49, rgbPayload);

      // Slice packet into 180-byte MTU-safe chunks
      const CHUNK_SIZE = 180;
      for (let offset = 0; offset < framePacket.length; offset += CHUNK_SIZE) {
        const chunk = framePacket.slice(offset, offset + CHUNK_SIZE);
        
        if (writeChar.properties.writeWithoutResponse) {
          await writeChar.writeValueWithoutResponse(chunk);
        } else {
          await writeChar.writeValue(chunk);
        }
        await new Promise(r => setTimeout(r, 12));
      }
    } catch (err) {
      console.warn('Frame write error:', err);
    } finally {
      isSending = false;
    }
  }

  connectBtn.addEventListener('click', async () => {
    try {
      statusEl.textContent = 'Scanning for P031...';
      bleDevice = await navigator.bluetooth.requestDevice({
        filters: [{ namePrefix: 'P031' }],
        optionalServices: [SERVICE_UUID]
      });

      statusEl.textContent = 'Connecting...';
      const server = await bleDevice.gatt.connect();
      const service = await server.getPrimaryService(SERVICE_UUID);
      writeChar = await service.getCharacteristic(WRITE_CHAR_UUID);

      statusEl.textContent = 'Connected: ' + bleDevice.name;
      connectBtn.textContent = 'Disconnect';
      connectBtn.classList.add('btn-danger');
      toggleGpsBtn.disabled = false;

      bleDevice.addEventListener('gattserverdisconnected', () => {
        statusEl.textContent = 'Disconnected';
        connectBtn.textContent = 'Connect Backpack (BLE)';
        connectBtn.classList.remove('btn-danger');
        toggleGpsBtn.disabled = true;
        writeChar = null;
      });
    } catch (err) {
      statusEl.textContent = 'Error: ' + err.message;
    }
  });

  function toggleGps() {
    if (gpsWatchId) {
      navigator.geolocation.clearWatch(gpsWatchId);
      gpsWatchId = null;
      toggleGpsBtn.textContent = 'Start GPS Speedometer';
      currentSpeedMph = 0;
    } else {
      gpsWatchId = navigator.geolocation.watchPosition(
        (pos) => {
          const mps = pos.coords.speed;
          currentSpeedMph = (mps !== null && mps >= 0) ? mps * 2.23694 : 0;
        },
        (err) => console.warn(err.message),
        { enableHighAccuracy: true, maximumAge: 500, timeout: 5000 }
      );
      toggleGpsBtn.textContent = 'Stop GPS Speedometer';
    }
  }

  toggleGpsBtn.addEventListener('click', toggleGps);

  setInterval(() => {
    renderFrame();
    if (writeChar) {
      transmitCanvas();
    }
  }, 1000);
</script>
