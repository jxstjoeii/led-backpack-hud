<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>YSKJ Backpack HUD</title>
  <style>
    body {
      margin: 0;
      padding: 16px;
      background: #0e1117;
      color: #fff;
      font-family: -apple-system, system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    h2 {
      margin: 4px 0 12px;
      font-size: 1.15rem;
      color: #00ff66;
    }
    #matrix {
      width: 192px;
      height: 192px;
      background: #000;
      border: 2px solid #30363d;
      border-radius: 6px;
      image-rendering: pixelated;
    }
    .btn {
      width: 100%;
      max-width: 320px;
      padding: 14px;
      margin: 6px 0;
      font-size: 1rem;
      font-weight: bold;
      border: none;
      border-radius: 6px;
      background: #00ff66;
      color: #000;
      cursor: pointer;
    }
    .btn:disabled {
      background: #2b313a;
      color: #6e7681;
    }
    .btn-blue {
      background: #38bdf8;
      color: #000;
    }
    .btn-red {
      background: #ff4d4f;
      color: #fff;
    }
    input {
      width: 100%;
      max-width: 320px;
      padding: 12px;
      margin-top: 6px;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 4px;
      color: #fff;
      font-size: 0.95rem;
      box-sizing: border-box;
    }
    #log {
      width: 100%;
      max-width: 320px;
      height: 110px;
      background: #000;
      border: 1px solid #30363d;
      border-radius: 4px;
      padding: 8px;
      margin-top: 10px;
      font-family: monospace;
      font-size: 0.75rem;
      color: #58a6ff;
      overflow-y: scroll;
      white-space: pre-wrap;
      box-sizing: border-box;
    }
  </style>
</head>
<body>

  <h2>YSKJ Backpack HUD</h2>

  <canvas id="matrix" width="32" height="32"></canvas>

  <button id="connectBtn" class="btn">Connect Backpack (BLE)</button>
  <button id="testBtn" class="btn btn-blue" disabled>Send Test (Solid Green)</button>
  <button id="gpsBtn" class="btn" disabled>Start GPS Speedometer</button>

  <input type="text" id="trackInput" value="Daft Punk - Technologic" placeholder="Track Name">

  <div id="log">Ready to pair with YS device.</div>

  <script>
    const SERVICE_UUID = '0000fff0-0000-1000-8000-00805f9b34fb';
    const WRITE_CHAR_UUID = '0000fff2-0000-1000-8000-00805f9b34fb';

    const canvas = document.getElementById('matrix');
    const ctx = canvas.getContext('2d');
    const logEl = document.getElementById('log');
    const connectBtn = document.getElementById('connectBtn');
    const testBtn = document.getElementById('testBtn');
    const gpsBtn = document.getElementById('gpsBtn');
    const trackInput = document.getElementById('trackInput');

    let bleDevice = null;
    let writeChar = null;
    let gpsWatchId = null;
    let currentSpeed = 0;
    let scrollPos = 0;
    let isTransmitting = false;

    function print(msg) {
      logEl.textContent += '\n> ' + msg;
      logEl.scrollTop = logEl.scrollHeight;
    }

    // 32x32 HUD Canvas
    function drawHUD() {
      ctx.fillStyle = '#000000';
      ctx.fillRect(0, 0, 32, 32);

      // Speed Digits
      ctx.fillStyle = '#00FF66';
      ctx.font = 'bold 14px monospace';
      ctx.textAlign = 'center';
      ctx.fillText(Math.round(currentSpeed).toString(), 16, 12);

      // Units
      ctx.fillStyle = '#888888';
      ctx.font = '6px monospace';
      ctx.fillText('MPH', 16, 18);

      // Divider
      ctx.strokeStyle = '#222222';
      ctx.beginPath();
      ctx.moveTo(2, 21);
      ctx.lineTo(30, 21);
      ctx.stroke();

      // Track title scroll
      ctx.save();
      ctx.beginPath();
      ctx.rect(0, 22, 32, 10);
      ctx.clip();
      ctx.fillStyle = '#38bdf8';
      ctx.font = '7px monospace';
      ctx.textAlign = 'left';

      const title = (trackInput.value || 'Ready').trim();
      const txtWidth = ctx.measureText(title).width;
      ctx.fillText(title, 32 - scrollPos, 29);
      ctx.restore();

      scrollPos += 1;
      if (scrollPos > txtWidth + 32) scrollPos = 0;
    }

    setInterval(drawHUD, 100);

    // Build raw minimal 32x32 GIF binary blob
    function createMinimalGIF(rgbArray) {
      // Header + Logical Screen Descriptor (32x32, 256 colors global table)
      const header = [
        0x47, 0x49, 0x46, 0x38, 0x39, 0x61, // GIF89a
        0x20, 0x00, 0x20, 0x00,             // 32 x 32
        0xF7, 0x00, 0x00                    // GCT flag, 256 colors
      ];

      // 256-color palette (Black + Color values)
      const palette = [];
      for (let i = 0; i < 256; i++) {
        palette.push(i, i, i);
      }

      // Image Descriptor
      const imageDesc = [
        0x2C, 0x00, 0x00, 0x00, 0x00, 0x20, 0x00, 0x20, 0x00, 0x00, // Image header
        0x08 // LZW Minimum Code Size
      ];

      // Raster blocks
      const rasterData = [];
      for (let i = 0; i < 1024; i++) {
        rasterData.push(rgbArray[i] || 0x00);
      }

      const blocks = [];
      for (let i = 0; i < rasterData.length; i += 254) {
        const chunk = rasterData.slice(i, i + 254);
        blocks.push(chunk.length, ...chunk);
      }
      blocks.push(0x00, 0x3B); // Block terminator + GIF trailer

      return new Uint8Array([...header, ...palette, ...imageDesc, ...blocks]);
    }

    // Packetize using the AA 55 FF FF protocol envelope
    async function transmitPayload(payload) {
      if (!writeChar || isTransmitting) return;
      isTransmitting = true;

      try {
        const CHUNK_SIZE = 196;
        const totalChunks = Math.ceil(payload.length / CHUNK_SIZE);

        for (let idx = 0; idx < totalChunks; idx++) {
          const start = idx * CHUNK_SIZE;
          const end = Math.min(start + CHUNK_SIZE, payload.length);
          const chunkData = payload.slice(start, end);

          // Header: AA 55 FF FF + [Index High, Low] + [Total High, Low] + Data + Checksum
          const packet = new Uint8Array(chunkData.length + 9);
          packet[0] = 0xAA;
          packet[1] = 0x55;
          packet[2] = 0xFF;
          packet[3] = 0xFF;
          packet[4] = (idx >> 8) & 0xFF;
          packet[5] = idx & 0xFF;
          packet[6] = (totalChunks >> 8) & 0xFF;
          packet[7] = totalChunks & 0xFF;
          packet.set(chunkData, 8);

          // CheckSum8 Modulo
          let csum = 0;
          for (let j = 0; j < packet.length - 1; j++) {
            csum = (csum + packet[j]) & 0xFF;
          }
          packet[packet.length - 1] = csum;

          await writeChar.writeValueWithoutResponse(packet);
          await new Promise(r => setTimeout(r, 12));
        }
        print('Upload completed.');
      } catch (e) {
        print('Tx err: ' + e.message);
      } finally {
        isTransmitting = false;
      }
    }

    // Solid Neon Green Test Button Action
    testBtn.addEventListener('click', async () => {
      print('Sending Solid Green Test Pattern...');
      const solidGreenPixels = new Uint8Array(1024);
      solidGreenPixels.fill(0x30); // Palette color index for bright green
      const gifBytes = createMinimalGIF(solidGreenPixels);
      await transmitPayload(gifBytes);
    });

    // Pair with YS Backpack
    connectBtn.addEventListener('click', async () => {
      print('Scanning for YS backpack...');
      if (!navigator.bluetooth) {
        print('ERR: Web Bluetooth unavailable.');
        return;
      }

      try {
        bleDevice = await navigator.bluetooth.requestDevice({
          filters: [{ namePrefix: 'YS' }],
          optionalServices: [SERVICE_UUID]
        });

        print('Found: ' + bleDevice.name);
        print('Connecting...');

        const server = await bleDevice.gatt.connect();
        const service = await server.getPrimaryService(SERVICE_UUID);
        writeChar = await service.getCharacteristic(WRITE_CHAR_UUID);

        print('Connected! FFF2 ready.');
        connectBtn.textContent = 'Disconnect';
        connectBtn.classList.add('btn-red');
        testBtn.disabled = false;
        gpsBtn.disabled = false;

        bleDevice.addEventListener('gattserverdisconnected', () => {
          print('Disconnected.');
          connectBtn.textContent = 'Connect Backpack (BLE)';
          connectBtn.classList.remove('btn-red');
          testBtn.disabled = true;
          gpsBtn.disabled = true;
          writeChar = null;
        });

      } catch (e) {
        print('Connect error: ' + e.message);
      }
    });

    // Speedometer
    gpsBtn.addEventListener('click', () => {
      if (gpsWatchId) {
        navigator.geolocation.clearWatch(gpsWatchId);
        gpsWatchId = null;
        gpsBtn.textContent = 'Start GPS Speedometer';
        currentSpeed = 0;
        print('GPS stopped.');
      } else {
        print('Starting GPS...');
        gpsWatchId = navigator.geolocation.watchPosition(
          (pos) => {
            const mps = pos.coords.speed;
            currentSpeed = (mps !== null && mps >= 0) ? mps * 2.23694 : 0;
          },
          (e) => print('GPS Error: ' + e.message),
          { enableHighAccuracy: true, maximumAge: 500, timeout: 5000 }
        );
        gpsBtn.textContent = 'Stop GPS Speedometer';
        print('GPS tracking active.');
      }
    });
  </script>
</body>
</html>
