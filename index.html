<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Backpack HUD Controller</title>
  <style>
    :root {
      --bg: #0d1117;
      --card: #161b22;
      --accent: #00ff66;
      --text: #f0f6fc;
      --text-dim: #8b949e;
      --danger: #ff4d4f;
    }
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      margin: 0;
      padding: 16px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    h1 {
      font-size: 1.25rem;
      margin: 4px 0 14px 0;
      color: var(--accent);
      text-align: center;
    }
    .card {
      background: var(--card);
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 14px;
      width: 100%;
      max-width: 360px;
      margin-bottom: 12px;
    }
    .preview-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    canvas {
      width: 200px;
      height: 200px;
      background: #000000;
      border: 2px solid #30363d;
      border-radius: 6px;
      image-rendering: pixelated;
    }
    .btn {
      width: 100%;
      padding: 14px;
      border-radius: 6px;
      border: none;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: 8px;
      background: var(--accent);
      color: #000;
      touch-action: manipulation;
    }
    .btn:disabled {
      background: #30363d !important;
      color: var(--text-dim) !important;
      cursor: not-allowed;
    }
    .field {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    label {
      font-size: 0.75rem;
      color: var(--text-dim);
      text-transform: uppercase;
      font-weight: 600;
    }
    input {
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 4px;
      padding: 10px;
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
    }
    .status {
      font-size: 0.85rem;
      color: var(--text-dim);
      margin-top: 4px;
      text-align: center;
      min-height: 20px;
    }
  </style>
</head>
<body>

  <h1>Backpack HUD Controller</h1>

  <div class="card preview-box">
    <canvas id="matrix" width="64" height="64"></canvas>
    <div id="status" class="status">System Ready</div>
  </div>

  <div class="card">
    <button id="connectBtn" class="btn" type="button">Connect Backpack (BLE)</button>
    <button id="toggleGpsBtn" class="btn" type="button" disabled>Start GPS Speedometer</button>
  </div>

  <div class="card">
    <div class="field">
      <label for="trackInput">Now Playing Display</label>
      <input type="text" id="trackInput" value="Daft Punk - Technologic">
    </div>
  </div>

  <script>
    window.addEventListener('DOMContentLoaded', () => {
      const SERVICE_UUID = '0000e031-0000-1000-8000-00805f9b34fb';
      const WRITE_CHAR_UUID = '0000a031-0000-1000-8000-00805f9b34fb';

      const canvas = document.getElementById('matrix');
      const ctx = canvas.getContext('2d');
      const statusEl = document.getElementById('status');
      const connectBtn = document.getElementById('connectBtn');
      const toggleGpsBtn = document.getElementById('toggleGpsBtn');
      const trackInput = document.getElementById('trackInput');

      let bleDevice = null;
      let writeChar = null;
      let gpsWatchId = null;
      let currentSpeedMph = 0;
      let textScrollOffset = 0;
      let isSending = false;

      // Draw routine (safe canvas rendering)
      function renderFrame() {
        try {
          ctx.fillStyle = '#000000';
          ctx.fillRect(0, 0, 64, 64);

          // Top: Speed
          ctx.fillStyle = '#00FF66';
          ctx.font = 'bold 24px sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(Math.round(currentSpeedMph).toString(), 32, 20);

          // Subtitle: MPH
          ctx.fillStyle = '#888888';
          ctx.font = '8px sans-serif';
          ctx.fillText('MPH', 32, 33);

          // Accent Divider
          ctx.strokeStyle = '#222222';
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(4, 40);
          ctx.lineTo(60, 40);
          ctx.stroke();

          // Bottom Marquee Text
          ctx.save();
          ctx.beginPath();
          ctx.rect(0, 42, 64, 22);
          ctx.clip();

          ctx.fillStyle = '#38bdf8';
          ctx.font = '9px sans-serif';
          ctx.textAlign = 'left';
          ctx.textBaseline = 'top';

          const trackText = (trackInput.value || 'Ready').trim();
          const textWidth = ctx.measureText(trackText).width;

          ctx.fillText(trackText, 64 - textScrollOffset, 48);
          ctx.restore();

          textScrollOffset += 2;
          if (textScrollOffset > textWidth + 64) {
            textScrollOffset = 0;
          }
        } catch (e) {
          console.error('Canvas render error:', e);
        }
      }

      // Initial paint immediately on DOM ready
      renderFrame();
      setInterval(renderFrame, 100);

      // Packet sender for P031
      async function transmitCanvas() {
        if (!writeChar || isSending) return;
        isSending = true;

        try {
          const imgData = ctx.getImageData(0, 0, 64, 64).data;
          const totalPixels = 64 * 64;
          const buffer = new Uint8Array(totalPixels * 2);

          for (let i = 0; i < totalPixels; i++) {
            const r = imgData[i * 4];
            const g = imgData[i * 4 + 1];
            const b = imgData[i * 4 + 2];

            const r5 = (r >> 3) & 0x1F;
            const g6 = (g >> 2) & 0x3F;
            const b5 = (b >> 3) & 0x1F;
            const rgb565 = (r5 << 11) | (g6 << 5) | b5;

            buffer[i * 2] = (rgb565 >> 8) & 0xFF;
            buffer[i * 2 + 1] = rgb565 & 0xFF;
          }

          const PAYLOAD_PER_PACKET = 128;
          const totalChunks = Math.ceil(buffer.length / PAYLOAD_PER_PACKET);

          for (let chunkIdx = 0; chunkIdx < totalChunks; chunkIdx++) {
            const start = chunkIdx * PAYLOAD_PER_PACKET;
            const end = Math.min(start + PAYLOAD_PER_PACKET, buffer.length);
            const slice = buffer.slice(start, end);

            const packet = new Uint8Array(slice.length + 4);
            packet[0] = 0x02;
            packet[1] = chunkIdx;
            packet[2] = totalChunks;
            packet.set(slice, 3);

            let sum = 0;
            for (let j = 0; j < packet.length - 1; j++) sum += packet[j];
            packet[packet.length - 1] = sum & 0xFF;

            if (writeChar.properties.writeWithoutResponse) {
              await writeChar.writeValueWithoutResponse(packet);
            } else {
              await writeChar.writeValue(packet);
            }
            await new Promise(r => setTimeout(r, 15));
          }
        } catch (err) {
          console.warn('BLE write error:', err);
        } finally {
          isSending = false;
        }
      }

      // Connect Button handler
      connectBtn.addEventListener('click', async () => {
        if (!navigator.bluetooth) {
          alert('Web Bluetooth is not available. Please ensure you are inside the Bluefy browser app.');
          return;
        }

        try {
          statusEl.textContent = 'Scanning for P031...';
          bleDevice = await navigator.bluetooth.requestDevice({
            filters: [{ namePrefix: 'P031' }],
            optionalServices: [SERVICE_UUID]
          });

          statusEl.textContent = 'Connecting...';
          const server = await bleDevice.gatt.connect();
          const service = await server.getPrimaryService(SERVICE_UUID);
          writeChar = await service.getCharacteristic(WRITE_CHAR_UUID);

          statusEl.textContent = 'Connected: ' + bleDevice.name;
          connectBtn.textContent = 'Disconnect';
          connectBtn.style.background = 'var(--danger)';
          connectBtn.style.color = '#fff';
          toggleGpsBtn.disabled = false;

          bleDevice.addEventListener('gattserverdisconnected', () => {
            statusEl.textContent = 'Disconnected';
            connectBtn.textContent = 'Connect Backpack (BLE)';
            connectBtn.style.background = 'var(--accent)';
            connectBtn.style.color = '#000';
            toggleGpsBtn.disabled = true;
            writeChar = null;
          });

          setInterval(() => {
            if (writeChar) transmitCanvas();
          }, 1000);

        } catch (err) {
          statusEl.textContent = 'Error: ' + err.message;
        }
      });

      // GPS Button handler
      toggleGpsBtn.addEventListener('click', () => {
        if (gpsWatchId) {
          navigator.geolocation.clearWatch(gpsWatchId);
          gpsWatchId = null;
          toggleGpsBtn.textContent = 'Start GPS Speedometer';
          currentSpeedMph = 0;
        } else {
          gpsWatchId = navigator.geolocation.watchPosition(
            (pos) => {
              const mps = pos.coords.speed;
              currentSpeedMph = (mps !== null && mps >= 0) ? mps * 2.23694 : 0;
            },
            (err) => console.warn(err.message),
            { enableHighAccuracy: true, maximumAge: 500, timeout: 5000 }
          );
          toggleGpsBtn.textContent = 'Stop GPS Speedometer';
        }
      });
    });
  </script>
</body>
</html>
